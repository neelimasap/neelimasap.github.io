<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="build" content="__BUILD__">
<meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Jobs">
<title>Private dashboard</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#3b82f6 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#8b5cf6 0,transparent 55%),#0b1020;color:#e5e7eb}
form{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.15);width:min(92vw,390px);padding:32px 28px;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}h1{margin:0 0 4px;font-size:22px}p{margin:0 0 20px;color:#94a3b8;font-size:14px}
label{display:block;font-size:13px;margin:14px 0 6px;font-weight:600;color:#cbd5e1}input[type=email],input[type=password]{width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.18);border-radius:12px;font-size:16px;background:rgba(0,0,0,.25);color:#fff;outline:none}input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.3)}
.r{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:14px}.r input{width:20px;height:20px}button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-size:16px;font-weight:600;cursor:pointer;min-height:48px}
#e{color:#fca5a5;font-size:13px;min-height:18px;margin-top:10px}.sk{display:none;width:min(92vw,900px)}.sk div{height:110px;border-radius:16px;margin:12px 0;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06));background-size:200% 100%;animation:sh 1.1s infinite}@keyframes sh{to{background-position:-200% 0}}</style></head>
<body><form id="f"><h1>🔒 Private dashboard</h1><p>Sign in to continue.</p><label for="u">Username</label><input id="u" type="email" autocomplete="username" required><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<div class="r"><input id="m" type="checkbox"><label for="m" style="margin:0;font-weight:400">Remember me on this device</label></div><button id="b">Unlock</button><div id="e" role="alert"></div></form>
<div class="sk" id="sk"><div></div><div></div><div></div><div></div></div>
<script>
const S="__SALT__",I="__IV__",C="__CT__",N=__ITERS__,K="aj_key_v1";const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(u,p){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(u.trim().toLowerCase()+":"+p),"PBKDF2",false,["deriveBits"]);return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:d(S),iterations:N,hash:"SHA-256"},km,256))}
async function open_(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(I)},k,d(C));return new TextDecoder().decode(pt)}
function busy(){f.style.display="none";sk.style.display="block"}
function show(h){document.querySelectorAll("style,link[rel=stylesheet]").forEach(e=>e.remove());document.open();document.write(h);document.close()}
(async()=>{const s=localStorage.getItem(K);if(s){busy();try{show(await open_(d(s)));return}catch(e){localStorage.removeItem(K);f.style.display="";sk.style.display="none"}}})();
f.onsubmit=async e=>{e.preventDefault();b.disabled=1;b.textContent="Unlocking…";try{const raw=await derive(u.value,p.value);busy();const h=await open_(raw);if(m.checked)localStorage.setItem(K,btoa(String.fromCharCode(...raw)));show(h)}catch(x){f.style.display="";sk.style.display="none";document.getElementById("e").textContent="Incorrect username or password.";b.disabled=0;b.textContent="Unlock"}};
</script></body></html>
