<style>*{box-sizing:border-box}:root{--bg:#f6f7f9;--card:#fff;--line:#e6e8ec;--ink:#0f172a;--mut:#64748b;--acc:#4f46e5;--accs:rgba(79,70,229,.12);--soft:#f1f3f6}
@media(prefers-color-scheme:dark){:root{--bg:#0b0c0f;--card:#131519;--line:#22252b;--ink:#e8eaee;--mut:#8b93a1;--acc:#8b93ff;--accs:rgba(139,147,255,.18);--soft:#1a1d22}}
html,body{overflow-x:clip}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);padding:24px 16px;
background-image:radial-gradient(600px 300px at 50% -80px,var(--accs),transparent 70%)}
form{background:var(--card);border:1px solid var(--line);width:min(100%,380px);padding:32px 28px 26px;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 40px rgba(15,23,42,.08);animation:in .35s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;margin-bottom:18px;box-shadow:0 6px 16px rgba(79,70,229,.3)}
h1{margin:0 0 4px;font-size:21px;font-weight:650;letter-spacing:-.02em}p{margin:0 0 22px;color:var(--mut);font-size:14px}
label{display:block;font-size:13px;margin:14px 0 6px;font-weight:500}
input[type=email],input[type=password]{width:100%;padding:0 12px;height:44px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.r{display:flex;align-items:center;gap:10px;margin:16px 0 18px;font-size:14px;color:var(--mut)}.r input{width:18px;height:18px;accent-color:var(--acc)}
button{width:100%;height:46px;border:0;border-radius:10px;background:var(--ink);color:var(--card);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}button:hover{opacity:.92}button:disabled{opacity:.6;cursor:wait}
#e{color:#dc2626;font-size:13px;min-height:18px;margin-top:10px;text-align:center}
.foot{margin-top:18px;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}.foot svg{width:14px;height:14px}
.sk{display:none;width:min(100%,920px);align-self:center;margin-top:60px}.sk div{height:104px;border-radius:12px;margin:8px 0;border:1px solid var(--line);background:linear-gradient(90deg,var(--card) 0,var(--soft) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.1s infinite}.sk div:first-child{height:40px;width:60%;border:0}@keyframes sh{to{background-position:-200% 0}}</style></head>
